{% extends "base.html" %}
{% block title %}Mind Mate 실시간 · 연구자 포털{% endblock %}
{% block head %}
<style>
.portal-wrap{min-height:calc(100vh - var(--nav-h));background:var(--bg);}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:#fee2e2;color:#dc2626;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:100px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#dc2626;animation:live-pulse 1.4s infinite;}
@keyframes live-pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.mm-event{border-top:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.mm-event:first-child{border-top:none;}
.mm-type{font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:100px;white-space:nowrap;}
.mm-type-music{background:rgba(79,195,247,.16);color:#0288d1;}
.mm-type-survey{background:var(--accent-light);color:var(--accent);}
.mm-type-sync{background:rgba(251,146,60,.16);color:#c2410c;}
.mm-time{font-size:.78rem;color:var(--muted);margin-left:auto;}
/* ── Sidebar layout (다른 포털 화면과 동일) ── */
.lin-wrap{display:flex;height:calc(100vh - var(--nav-h,72px));overflow:hidden;background:var(--bg);}
.lin-sidebar{width:232px;min-width:232px;height:100%;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.lin-sidebar-top{padding:14px 10px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.lin-workspace{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;}
.lin-workspace-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--violet,#7c6fe0),#4fc3f7);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#fff;font-weight:900;flex-shrink:0;}
.lin-workspace-name{font-size:.84rem;font-weight:700;color:var(--fg-1,#fff);line-height:1.2;}
.lin-workspace-user{font-size:.7rem;color:var(--fg-4,rgba(255,255,255,.35));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}
.lin-sidebar-scroll{flex:1;overflow-y:auto;padding:8px 0 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.lin-sidebar-bottom{padding:8px;border-top:1px solid var(--border);flex-shrink:0;}
.lin-nav-section{margin-bottom:4px;}
.lin-nav-item{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:.81rem;color:var(--fg-3,rgba(255,255,255,.6));text-decoration:none;border-radius:8px;margin:1px 6px;cursor:pointer;transition:background .12s,color .12s;user-select:none;}
.lin-nav-item:hover{background:rgba(124,111,224,.09);color:var(--fg-1);}
.lin-nav-item.active{background:rgba(124,111,224,.16);color:var(--violet-soft,#a89af0);font-weight:600;}
.lin-nav-icon{font-size:.82rem;width:18px;text-align:center;flex-shrink:0;}
.lin-nav-arrow{margin-left:auto;font-size:.58rem;color:var(--fg-4);transition:transform .2s;}
.lin-nav-item.expanded .lin-nav-arrow{transform:rotate(90deg);}
.lin-sub-group{display:none;}
.lin-sub-group.open{display:block;}
.lin-nav-sub{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 36px;font-size:.78rem;color:var(--fg-3);text-decoration:none;border-radius:7px;margin:1px 6px;cursor:pointer;transition:background .12s,color .12s;}
.lin-nav-sub:hover{background:rgba(124,111,224,.08);color:var(--fg-1);}
.lin-nav-sub.active{background:rgba(124,111,224,.12);color:var(--violet-soft,#a89af0);font-weight:600;}
.lin-main{flex:1;overflow-y:auto;min-width:0;}
@media(max-width:640px){.lin-sidebar{display:none;}}
</style>
{% endblock %}

{% block content %}
<div class="lin-wrap">
  {% include "_portal_sidebar.html" %}
  <div class="lin-main">
  <div class="container" style="padding-top:28px;padding-bottom:40px;">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;">
      <h1 style="margin:0;font-size:1.4rem;">🔴 Mind Mate 실시간</h1>
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    </div>
    <div style="font-size:.8rem;color:var(--muted);margin-bottom:18px;" id="statusLine">불러오는 중…</div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;" id="listBox">
      <div style="text-align:center;padding:60px 20px;color:var(--muted);">불러오는 중…</div>
    </div>

    <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtTime(t){
      if (!t) return '';
      var s = String(t).slice(0,19).replace('T',' ');
      return s;
    }

    function renderList(events){
      const box = document.getElementById('listBox');
      if (!events.length){
        box.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted);"><div style="font-size:2.5rem;margin-bottom:12px;">📭</div><div>최근 활동이 없습니다.</div></div>';
        return;
      }
      box.innerHTML = events.map(e => `
        <div class="mm-event">
          <span class="mm-type mm-type-${e.type}">${esc(e.label)}</span>
          <span style="font-weight:700;font-size:.88rem;">${esc(e.participant)}</span>
          <span style="font-size:.8rem;color:var(--muted);">${esc(e.date)}${e.detail ? ' · ' + esc(e.detail) : ''}</span>
          <span class="mm-time">${fmtTime(e.at)}</span>
        </div>`).join('');
    }

    async function pollData(){
      try {
        const res = await fetch('/portal/mindmate/live/data');
        const json = await res.json();
        if (json.ok) {
          renderList(json.events);
          document.getElementById('statusLine').textContent =
            `최근 ${json.events.length}건 · 마지막 갱신 ${new Date().toLocaleTimeString('ko-KR')}`;
        }
      } catch (e) {
        document.getElementById('statusLine').textContent = '갱신 실패 — 잠시 후 다시 시도합니다.';
      }
    }
    pollData();
    setInterval(pollData, 10000);
    </script>

  </div>
  </div>
</div>
<script>
function toggleNav(key){var btn=document.getElementById('nav-'+key),group=document.getElementById('sub-'+key);if(!btn||!group)return;var open=group.classList.contains('open');group.classList.toggle('open',!open);btn.classList.toggle('expanded',!open);}
</script>
{% endblock %}
